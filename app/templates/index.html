<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigShield - Parametric Weather Protection</title>
  <style>
    :root {
      --primary: #0070ba;
      --primary-hover: #005ea6;
      --success: #107c41;
      --warning: #d83b01;
      --bg: #f4f7f9;
      --card-bg: #ffffff;
      --text: #1a1f36;
      --muted: #697386;
      --border: #e3e8ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 820px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 26px; color: var(--primary); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 14px; }
    
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    select, input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    select:focus, input:focus { border-color: var(--primary); }
    
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .preset-btn { background: #eef2f6; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #333; }
    .preset-btn:hover { background: #dce4ec; }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 18px; }
    @media (max-width: 600px) { .btn-row { grid-template-columns: 1fr; } }
    
    button.action-btn {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-premium { background: #0070ba; color: white; }
    .btn-premium:hover { background: #005ea6; }
    .btn-forecast { background: #5c3b99; color: white; }
    .btn-forecast:hover { background: #4a2f7c; }
    .btn-claim { background: #107c41; color: white; }
    .btn-claim:hover { background: #0b5f31; }
    .btn-sub { font-size: 11px; font-weight: 400; opacity: 0.9; }

    .result-box { display: none; margin-top: 20px; padding: 16px; border-radius: 8px; border: 1px solid var(--border); background: #fafbfc; }
    .result-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #dff6dd; color: #107c41; }
    .badge-warning { background: #fed9cc; color: #d83b01; }
    .badge-info { background: #e0f2fe; color: #0284c7; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
    .stat-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--text); }
    
    .paypal-box { margin-top: 14px; padding: 12px; border-radius: 8px; background: #ebf5fb; border: 1px solid #bce1f5; }
    .paypal-link { display: inline-block; margin-top: 8px; background: #0070ba; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .paypal-link:hover { background: #005ea6; }
    .capture-btn { margin-left: 8px; background: #107c41; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    
    .log-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .log-table th, .log-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    .log-table th { background: #f8fafc; font-weight: 600; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GigShield Parametric Weather Protection</h1>
      <p>Automated income protection for gig delivery workers during severe weather &bull; PayPal Sandbox &bull; Real Weather Data</p>
    </header>

    <div class="card">
      <div class="form-grid">
        <div>
          <label for="spotSelect">Delivery Zone (Spot):</label>
          <select id="spotSelect">
            <optgroup label="Chennai">
              <option value="Velachery" selected>Velachery (Risk Score: 43)</option>
              <option value="Adyar">Adyar (Risk Score: 24)</option>
              <option value="Anna Nagar">Anna Nagar (Risk Score: 31)</option>
              <option value="Tambaram">Tambaram (Risk Score: 22)</option>
            </optgroup>
            <optgroup label="Visakhapatnam">
              <option value="Pendurthi">Pendurthi (Risk Score: 60)</option>
              <option value="Gajuwaka">Gajuwaka (Risk Score: 52)</option>
              <option value="Madhurawada">Madhurawada (Risk Score: 50)</option>
              <option value="Maddilapalem">Maddilapalem (Risk Score: 49)</option>
            </optgroup>
          </select>
        </div>

        <div>
          <label for="dateInput">Date (YYYY-MM-DD):</label>
          <input type="text" id="dateInput" value="2023-12-04" placeholder="2023-12-04">
          <div class="presets">
            <button class="preset-btn" onclick="setPreset('Velachery', '2023-12-04')">Michaung (191.8 mm)</button>
            <button class="preset-btn" onclick="setPreset('Adyar', '2021-11-11')">Chennai Rain (207.6 mm)</button>
            <button class="preset-btn" onclick="setPreset('Pendurthi', '2015-11-01')">Vizag Downpour (285.3 mm)</button>
            <button class="preset-btn" onclick="setPreset('Velachery', '2024-03-15')">Sunny Dry Day (0 mm)</button>
          </div>
        </div>
      </div>

      <!-- 3 Simple Buttons -->
      <div class="btn-row">
        <button class="action-btn btn-premium" onclick="onPayPremium()">
          <span>Pay Premium</span>
          <span class="btn-sub">PayPal Sandbox Order</span>
        </button>

        <button class="action-btn btn-forecast" onclick="onCheckForecast()">
          <span>Check Forecast</span>
          <span class="btn-sub">XGBoost AI Tomorrow Risk</span>
        </button>

        <button class="action-btn btn-claim" onclick="onReplayStorm()">
          <span>Replay Real Storm Day</span>
          <span class="btn-sub">Parametric Claim Payout (Rs. 400)</span>
        </button>
      </div>

      <!-- Result Card -->
      <div id="resultBox" class="result-box">
        <div class="result-title">
          <span id="resultHeading">Action Result</span>
          <span id="resultBadge" class="badge"></span>
        </div>
        <p id="resultMessage" style="font-size: 14px; margin-bottom: 12px;"></p>
        
        <div id="statsRow" class="stats-grid"></div>
        <div id="paypalActionRow" class="paypal-box" style="display:none;"></div>
      </div>
    </div>

    <!-- Payout Log History -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size: 16px;">Recent Payout Activity (PayPal-confirmed only)</h3>
        <div>
          <button class="preset-btn" onclick="loadPayoutHistory()">↻ Refresh</button>
          <button class="preset-btn" onclick="onClearLog()" style="color:#d83b01; margin-left:4px;">✕ Clear Log</button>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="log-table" id="payoutTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Spot</th>
              <th>Rain</th>
              <th>Payout (Rs / USD)</th>
              <th>Status</th>
              <th>Week / Cap</th>
            </tr>
          </thead>
          <tbody id="payoutTableBody">
            <tr><td colspan="6" style="text-align:center; color: var(--muted);">Loading payout log...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function setPreset(spot, date) {
      document.getElementById('spotSelect').value = spot;
      document.getElementById('dateInput').value = date;
    }

    async function onPayPremium() {
      const spot = document.getElementById('spotSelect').value;
      const date = document.getElementById('dateInput').value;
      showLoading("Creating PayPal Sandbox Order...");

      try {
        const res = await fetch(`/pay-premium?spot=${encodeURIComponent(spot)}&week_start=${encodeURIComponent(date)}`, { method: 'POST' });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.detail || "Failed to create premium order");

        showResult({
          heading: `Weekly Premium Order (${data.spot})`,
          badge: "ORDER CREATED",
          badgeClass: "badge-info",
          message: `Dynamic weekly premium: Rs. ${data.premium_inr.toFixed(1)} ($${data.premium_usd.toFixed(2)} USD). Approval order created in PayPal Sandbox.`,
          stats: [
            { label: "Premium (INR)", value: `Rs. ${data.premium_inr.toFixed(1)}` },
            { label: "Premium (USD)", value: `$${data.premium_usd.toFixed(2)}` },
            { label: "Currency Rate", value: data.exchange_rate },
            { label: "Order ID", value: data.order_id.slice(0, 10) + '...' }
          ],
          paypalHtml: `
            <strong>PayPal Sandbox Order ID:</strong> <code>${data.order_id}</code><br>
            <p style="font-size:12px; margin-top:4px; color:#555;">Click below to approve the payment in Sandbox, or click Capture if approved:</p>
            <div style="margin-top:8px;">
              <a href="${data.approval_url}" target="_blank" class="paypal-link">&rarr; Approve on PayPal Sandbox</a>
              <button class="capture-btn" onclick="onCaptureOrder('${data.order_id}')">Capture Payment</button>
            </div>
          `
        });
      } catch (err) {
        showError(err.message);
      }
    }

    async function onCaptureOrder(orderId) {
      showLoading("Capturing PayPal Sandbox Order...");
      try {
        const res = await fetch(`/capture-order?order_id=${encodeURIComponent(orderId)}`, { method: 'POST' });
        const data = await res.json();
        
        if (data.status === "COMPLETED") {
          alert(`PayPal Payment Captured Successfully! Order: ${orderId}`);
          onPayPremium();
        } else {
          alert(`PayPal Status: ${data.status}\n${data.message}`);
        }
      } catch (err) {
        alert("Capture error: " + err.message);
      }
    }

    async function onCheckForecast() {
      const spot = document.getElementById('spotSelect').value;
      const date = document.getElementById('dateInput').value;
      showLoading("Running XGBoost model on real weather features...");

      try {
        const res = await fetch(`/forecast?spot=${encodeURIComponent(spot)}&date=${encodeURIComponent(date)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Forecast lookup failed");

        const isAlarm = data.alarm_triggered;
        const nextActual = data.next_day_real_outcome ? `Next day rain: ${data.next_day_real_outcome.rain_mm} mm` : "Next day: End of series";

        showResult({
          heading: `AI Rain Forecast for Tomorrow (${data.spot}, ${data.date})`,
          badge: isAlarm ? "ALARM TRIGGERED" : "LOW RISK",
          badgeClass: isAlarm ? "badge-warning" : "badge-success",
          message: `Chance of work-stopping rain tomorrow: <strong>${data.work_stop_chance_percent}%</strong> (Cutoff threshold: ${data.alarm_cutoff_percent}%). Real history verifies: ${nextActual}.`,
          stats: [
            { label: "Rain Tomorrow Chance", value: `${data.work_stop_chance_percent}%` },
            { label: "Today's Rain", value: `${data.today_weather.rain_mm.toFixed(1)} mm` },
            { label: "Max Temp", value: `${data.today_weather.temp_max_c.toFixed(1)} °C` },
            { label: "Wind Speed", value: `${data.today_weather.wind_max_kmh.toFixed(1)} km/h` }
          ]
        });
      } catch (err) {
        showError(err.message);
      }
    }

    async function onReplayStorm() {
      const spot = document.getElementById('spotSelect').value;
      const date = document.getElementById('dateInput').value;
      showLoading("Checking real rainfall and calling PayPal Payouts API...");

      try {
        const res = await fetch(`/check-claim?spot=${encodeURIComponent(spot)}&date=${encodeURIComponent(date)}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Claim check failed");

        // Map claim_status to badge
        const statusMap = {
          "APPROVED":           { badge: "CLAIM APPROVED & PAID",   cls: "badge-success" },
          "PAYOUT_FAILED":      { badge: "PAYOUT FAILED",           cls: "badge-warning" },
          "WEEKLY_CAP_REACHED": { badge: "WEEKLY CAP REACHED",      cls: "badge-warning" },
          "NO_CLAIM":           { badge: "NO DISRUPTION",           cls: "badge-info"    },
        };
        const { badge, cls } = statusMap[data.claim_status] || { badge: data.claim_status, cls: "badge-info" };

        // Build PayPal detail box
        let paypalHtml = null;
        if (data.claim_status === "APPROVED") {
          paypalHtml = `
            <strong>✅ PayPal Payout sent (HTTP 201)</strong><br>
            <strong>Recipient:</strong> <code>${data.worker_email}</code><br>
            <strong>PayPal Batch ID:</strong> <code>${data.paypal_batch_id}</code><br>
            <strong>Amount:</strong> Rs. ${data.payout_inr} = $${data.payout_usd} USD
          `;
        } else if (data.claim_status === "PAYOUT_FAILED") {
          paypalHtml = `
            <strong style="color:#d83b01;">❌ PayPal refused — no fake success recorded</strong><br>
            <strong>HTTP status:</strong> ${data.paypal_status_code}<br>
            <strong>Error:</strong> ${data.paypal_error_name}<br>
            <strong>Message:</strong> ${data.paypal_error_message}<br>
            <strong>PayPal Debug ID:</strong> <code>${data.paypal_debug_id || 'n/a'}</code>
          `;
        }

        showResult({
          heading:   `Storm Replay Claim (${data.spot}, ${data.date})`,
          badge:     badge,
          badgeClass: cls,
          message:   data.message,
          stats: [
            { label: "Actual Rain",    value: `${data.rain_mm.toFixed(1)} mm` },
            { label: "35 mm Trigger",  value: data.work_stop_today ? "✓ Triggered" : "✗ No" },
            { label: "Payout Amount",  value: data.payout_approved ? `Rs. ${data.payout_inr} ($${data.payout_usd})` : "Rs. 0" },
            { label: "Weekly Cap",     value: `${data.weekly_claims_count || 0} / ${data.weekly_cap || 3} days` }
          ],
          paypalHtml
        });

        loadPayoutHistory();
      } catch (err) {
        showError(err.message);
      }
    }

    async function onClearLog() {
      if (!confirm("Clear the payout log? This resets the weekly cap counter.")) return;
      const res = await fetch('/payouts/reset', { method: 'DELETE' });
      const data = await res.json();
      alert(data.message);
      loadPayoutHistory();
    }

    function showLoading(msg) {
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      document.getElementById('resultHeading').innerText = "Processing...";
      document.getElementById('resultBadge').innerText = "PLEASE WAIT";
      document.getElementById('resultBadge').className = "badge badge-info";
      document.getElementById('resultMessage').innerText = msg;
      document.getElementById('statsRow').innerHTML = "";
      document.getElementById('paypalActionRow').style.display = 'none';
    }

    function showResult({ heading, badge, badgeClass, message, stats, paypalHtml }) {
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      document.getElementById('resultHeading').innerText = heading;
      
      const badgeEl = document.getElementById('resultBadge');
      badgeEl.innerText = badge;
      badgeEl.className = `badge ${badgeClass}`;
      
      document.getElementById('resultMessage').innerHTML = message;

      const statsEl = document.getElementById('statsRow');
      statsEl.innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      `).join('');

      const paypalEl = document.getElementById('paypalActionRow');
      if (paypalHtml) {
        paypalEl.innerHTML = paypalHtml;
        paypalEl.style.display = 'block';
      } else {
        paypalEl.style.display = 'none';
      }
    }

    function showError(msg) {
      showResult({
        heading: "Error",
        badge: "FAILED",
        badgeClass: "badge-warning",
        message: `<span style="color:var(--warning); font-weight:600;">${msg}</span>`,
        stats: []
      });
    }

    async function loadPayoutHistory() {
      try {
        const res = await fetch('/payouts');
        const data = await res.json();
        const tbody = document.getElementById('payoutTableBody');
        
        if (!data.payouts || data.payouts.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--muted);">No payouts recorded yet. Click 'Replay Real Storm Day' above to trigger one.</td></tr>`;
          return;
        }

        const reversed = [...data.payouts].reverse();
        tbody.innerHTML = reversed.map(p => `
          <tr>
            <td><strong>${p.date}</strong></td>
            <td>${p.spot}</td>
            <td>${p.rain_mm.toFixed(1)} mm</td>
            <td>Rs. ${p.payout_inr.toFixed(0)} ($${p.payout_usd.toFixed(2)})</td>
            <td><span class="badge badge-success">PayPal 201 ✓</span></td>
            <td>${p.weekly_claim_index || 1} / 3 (Wk ${p.week})</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error("Failed to load payout history:", err);
      }
    }

    // Load initial history on page load
    loadPayoutHistory();
  </script>
</body>
</html>
